[project]
name = "internship-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yassinebenkacem123", email = "yassinbenkacem12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
internship-agent = "internship_agent.main:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
